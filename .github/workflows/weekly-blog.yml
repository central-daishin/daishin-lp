name: Weekly Blog Post

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install anthropic
      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_blog.py
      - name: Commit and push
        run: |
          git config user.name "Blog Bot"
          git config user.email "bot@houmon-central.com"
          git add posts.json
          git diff --staged --quiet || git commit -m "Add weekly blog post"
          git push
